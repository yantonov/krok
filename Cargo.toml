[package]
name = "krok"
version = "0.3.0"
authors = ["Yury Antonov <1390348+yantonov@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.85"
description = "Attach multiple commands to any git hook without maintaining shell scripts"
repository = "https://github.com/yantonov/krok"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "cargo"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10" }
anyhow = "1.0.104"

[dev-dependencies]
tempfile = "3"

[profile.release]
# https://github.com/johnthagen/min-sized-rust
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
lto = true # remove dead code and often times reduces binary size
codegen-units = 1 # to allow for maximum size reduction optimizations
panic = "abort" #  removes the need for this extra unwinding code
